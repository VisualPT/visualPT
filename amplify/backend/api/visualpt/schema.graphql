enum UserStatus {
  ADMIN
}

type User @model @auth(rules: [{allow: public}]) {
  id: ID!
  email: AWSEmail!
  first_name: String!
  last_name: String!
  status: UserStatus!
}

type SkeletalSequence @model @auth(rules: [{allow: public}]) {
  id: ID!
  frame_num: Int!
  nose: String
  left_eye: String
  right_eye: String
  left_ear: String
  right_ear: String
  left_shoulder: String
  right_shoulder: String
  left_elbow: String
  right_elbow: String
  left_wrist: String
  right_wrist: String
  left_hip: String
  right_hip: String
  left_knee: String
  right_knee: String
  left_ankle: String
  right_ankle: String
  assessmentID: ID! @index(name: "byAssessment")
}

type Patient @model @auth(rules: [{allow: owner}]) {
  id: ID!
  first_name: String!
  last_name: String!
  dob: AWSDate!
  gender: Gender!
  height_in_inches: Float!
  Assessments: [Assessment] @hasMany(indexName: "byPatient", fields: ["id"])
  provider_contact: AWSEmail!
}

type Assessment @model @auth(rules: [{allow: owner}]) {
  id: ID!
  patientID: ID! @index(name: "byPatient")
  type: AssessmentType!
  timestamp: AWSTimestamp!
  skeletalSequences: [SkeletalSequence] @hasMany(indexName: "byAssessment", fields: ["id"])
  duration: Int
  pdf: String
}

enum Gender {
  MALE
  FEMALE
}

enum AssessmentType {
  CTSIB
  GAIT
}
 