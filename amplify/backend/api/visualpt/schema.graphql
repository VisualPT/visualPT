enum FallHistory {
  NONE
  FEW
  RECURRENT
}

enum UserStatus {
  ADMIN
}

enum Gender {
  MALE
  FEMALE
}

enum AssessmentType {
  CTSIB
  GAIT
  BERG
  REACH
  FIST
}

type User @model @auth(rules: [{ allow: public }]) {
  id: ID!
  email: AWSEmail!
  first_name: String!
  last_name: String!
  status: UserStatus!
  Subjects: [Subject!] @hasMany(indexName: "byUser", fields: ["id"])
}

type Subject @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  userID: ID! @index(name: "byUser")
  first_name: String!
  last_name: String!
  dob: AWSDate!
  gender: Gender!
  height_in_inches: Float!
  fall_history: FallHistory!
  provider_contact: AWSEmail!
  Assessments: [Assessment!] @hasMany(indexName: "bySubject", fields: ["id"])
}

type Assessment @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  subjectID: ID! @index(name: "bySubject")
  type: AssessmentType!
  datetime: AWSDateTime!
  duration: Float! #seconds
  pdf: String
  Conditions: [Condition!] @hasMany(indexName: "byAssessment", fields: ["id"])
}

type Condition @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  assessmentID: ID! @index(name: "byAssessment")
  sequenceNumber: Int!
  duration: Float! #seconds
  trials: [Trial!] @hasMany(indexName: "byCondition", fields: ["id"])
}

type Trial @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  conditionID: ID! @index(name: "byCondition")
  start_time: AWSDateTime!
  duration: Float! #seconds
  Detections: [Detection!]
}

type Detection {
  id: String!
  version: Int!
  obtrustion: Boolean!
  instability: Boolean!
  env: DetectionEnv!
  keypoints: String!
  prediction: String
}

type DetectionEnv {
  imageHeight: Int
  imageWidth: Int
  accX: Float
  accY: Float
  accZ: Float
  gyroX: Float
  gyroY: Float
  gyroZ: Float
}

